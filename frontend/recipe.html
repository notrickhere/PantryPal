<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PantryPal Recipe</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Google 8bit Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/recipes.css" />
</head>

<body class="bg-light">
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="logo">Pantry Pal</h3>
      <a href="/" class="btn btn-outline-secondary">Back</a>
    </div>

    <div id="errorMessage" class="alert alert-danger d-none"></div>

    <h1 id="recipeTitle" class="main-title mb-4"></h1>

    <div class="row g-4">
      <div class="col-md-6">
        <img id="recipeImage" class="img-fluid rounded shadow-sm" alt="" />
      </div>

      <div class="col-md-6">
        <div class="card p-3 mb-4">
          <h5>Ingredients</h5>
          <ul id="ingredientsList" class="mb-0"></ul>
        </div>

        <div class="card p-3">
          <h5>How To Make It</h5>
          <ol id="stepsList" class="mb-0"></ol>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/recipe-detail.js"></script>
</body>
</html>
